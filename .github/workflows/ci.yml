---
name: CI
permissions: {}

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Version to build, for example 2.2.0. Empty uses the tag or validation version.
        required: false
        default: ''
        type: string
  push:
    branches:
      - '**'
    tags:
      - '*'
  pull_request:
    branches:
      - main
      - master
      - canary

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-macos:
    name: macOS
    permissions:
      contents: read
    uses: ./.github/workflows/ci-macos.yml
    with:
      publish_release: 'false'
      release_commit: ${{ github.sha }}
      release_version: ${{ github.event.inputs.release_version || '2.0.0-pr-validation' }}
      release_channel: 'canary'
