name: Report a Crash
description: Vibepollo crashed or exited unexpectedly on macOS. Attach the macOS crash report (.ips) and logs if available.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        ### How to find a macOS crash report
        1. Open **Console.app** (콘솔) → **Crash Reports** (충돌 리포트), or open `~/Library/Logs/DiagnosticReports/` in Finder.
        2. Find the latest `Vibepollo-*.ips` (or `sunshine-*.ips`) file from the time of the crash.
        3. Attach the `.ips` file below (drag & drop works directly in GitHub).
        4. Optionally include the Vibepollo host log from **Settings → Network & Logs → System Logs → Reveal in Finder** (설정 → 네트워크 및 로그 → 시스템 로그 → Finder에서 보기).

  - type: input
    id: vibepollo-version
    attributes:
      label: Vibepollo Version
      placeholder: e.g., 1.3.0
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS Version
      placeholder: e.g., macOS 15.4.1 (Sequoia) or macOS 26.0 (Tahoe)
    validations:
      required: true

  - type: input
    id: mac-model
    attributes:
      label: Mac Model & Apple Silicon Chip
      placeholder: e.g., Mac mini M4, MacBook Pro M3 Pro
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Crash Summary
      description: Briefly describe what you were doing when Vibepollo crashed.
      placeholder: e.g., Vibepollo crashed immediately when starting an HDR 120Hz virtual display session from VoidLink.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce (if known)
      description: List any steps that reliably trigger the crash.
      placeholder: |
        1. Start Vibepollo
        2. Connect from client
        3. ...
    validations:
      required: false

  - type: textarea
    id: crash-report
    attributes:
      label: Crash Report (.ips) & Host Logs
      description: Drag and drop the `.ips` crash report and/or host log file here, or paste the relevant stack trace.
    validations:
      required: false

  - type: textarea
    id: extra-info
    attributes:
      label: Additional Details (Optional)
      description: Anything else that might help (client app, display configuration, USB vs Wi-Fi, LoginWindow enabled, etc.).
    validations:
      required: false
